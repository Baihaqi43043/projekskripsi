  # Tabel 3.1 PDF: Data Agroklimat (Time-Series)
  climate_features:
    - "curah_hujan"
    - "suhu_rata_rata"
    - "suhu_maksimal"
    - "suhu_minimum"
    - "kelembaban_rata_rata"
    - "lama_penyinaran"

  # Tabel 3.2 PDF: Data Kondisi Tanah dan Lingkungan (Statis)
  static_features:
    - "tekstur_tanah"
    - "ph_tanah"
    - "nitrogen"
    - "fosfor"
    - "kalium"
    - "karbon_organik"
    - "drainase"
    - "ketinggian_tempat"
    - "risiko_bencana_hama"

  sequence_length: 12     # Sliding window 12 bulan (bisa diubah ke 24/60)
  train_ratio: 0.8

lstm:
  hidden_size_1: 128
  hidden_size_2: 64
  embedding_dim: 32
  dropout: 0.2
  epochs: 30
  batch_size: 16
  learning_rate: 0.001

random_forest:
  n_estimators: 200
  max_depth: 15
  min_samples_split: 2
  min_samples_leaf: 1
  class_weight: "balanced"

recommendation:
  top_k: 3
