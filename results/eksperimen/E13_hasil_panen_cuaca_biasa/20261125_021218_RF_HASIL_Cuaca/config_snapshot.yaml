  # Tabel 3.1 PDF: Data Agroklimat (Time-Series)
  climate_features:
    - "curah_hujan"
    - "suhu_rata_rata"
    - "suhu_maksimal"
    - "suhu_minimum"
    - "kelembaban_rata_rata"
    # PERHATIAN SATUAN: dari NASA POWER ALLSKY_SFC_SW_DWN = radiasi matahari (MJ/m2/hari),
    # BUKAN lama penyinaran (jam/hari) seperti Tabel 3.1 proposal. Ganti bila data BMKG tersedia.
    - "lama_penyinaran"

  # Tabel 3.2 PDF: Data Kondisi Tanah dan Lingkungan (Statis)
  static_features:
    - "tekstur_tanah"
    - "ph_tanah"
    - "nitrogen"
    - "fosfor"
    - "kalium"
    - "karbon_organik"
    - "drainase"
    - "ketinggian_tempat"
    - "risiko_bencana_hama"

  sequence_length: 12     # Sliding window 12 bulan (bisa diubah ke 24/60)
  train_ratio: 0.8

lstm:
  hidden_size_1: 128
  hidden_size_2: 64
  embedding_dim: 32
  dropout: 0.2
  epochs: 30
  batch_size: 16
  learning_rate: 0.001

random_forest:
  n_estimators: 200
  max_depth: 15
  min_samples_split: 2
  min_samples_leaf: 1
  class_weight: "balanced"

recommendation:
  top_k: 3

# ------------------------------------------------------------------------------------------
# Pipeline Hybrid sesuai proposal (train_hybrid_proposal.py)
# ------------------------------------------------------------------------------------------
proposal:
  # Split kronologis berdasarkan TAHUN BULAN TARGET (Bagian 3.7 & 3.11 proposal):
  #   train <= train_end_year | validasi = val_year | test = test_year (hanya dipakai sekali)
  train_end_year: 2023
  val_year: 2024
  test_year: 2025
  # Fold cross-validation Random Forest (expanding window): latih < tahun, validasi = tahun
  cv_val_years: [2023, 2024]
  # Preprocessing (Bagian 3.10): penanganan outlier IQR (pagar Q1-k*IQR, Q3+k*IQR) + Z-Score
  iqr_factor: 1.5
  seasonal_features: true      # fitur turunan indeks musim (sin/cos bulan)
  # Encoder LSTM (arsitektur di bagian `lstm:`), dilatih meramal iklim bulan berikutnya
  max_epochs: 300
  early_stopping_patience: 20
  # Random Forest tuning (Bagian 3.11 Tahap 5)
  rf_search_iter: 20
  # Ulangi eksperimen dengan beberapa seed -> laporkan rata-rata +- std
  seeds: [42, 43, 44, 45, 46]
